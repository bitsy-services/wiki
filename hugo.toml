baseURL = 'https://wiki.bitsy.services/'
locale = 'en-us'
title = 'Bitsy Services Wiki'
theme = 'hugo-book'

# Agent-instruction files (directory-scoped CLAUDE.md) live alongside content
# but must never be rendered as wiki pages.
ignoreFiles = ['CLAUDE\.md$']

[params]
  BookToC = true
  BookSection = 'wiki'
  BookSearch = true

[markup]
  [markup.highlight]
    style = 'monokai'
    lineNos = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

baseURL = 'https://wiki.bitsy.services/'
locale = 'en-us'
title = 'Bitsy Wiki'
theme = 'hugo-book'

# Agent-instruction files (directory-scoped CLAUDE.md) live alongside content
# but must never be rendered as wiki pages.
ignoreFiles = ['CLAUDE\.md$']

[params]
  # Default Open Graph / Twitter card image, used by Hugo's embedded
  # opengraph.html, twitter_cards.html and schema.html for any page that does
  # not set its own `images` in frontmatter.
  images = ['og-image.png']

  BookToC = true
  BookSection = 'wiki'
  BookSearch = true

[markup]
  [markup.highlight]
    style = 'monokai'
    lineNos = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
